services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afrisun
      POSTGRES_USER: afrisun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrisun -d afrisun"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://afrisun:${POSTGRES_PASSWORD}@db:5432/afrisun
      SITE_URL: ${SITE_URL:?Set SITE_URL to canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ENQUIRIES_ENABLED: ${ENQUIRIES_ENABLED:-false}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-mfumu@afrisunenergy.co.za,anne@afrisunenergy.co.za,bester@afrisunenergy.co.za,admin@afrisunenergy.co.za}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - media:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  media:
